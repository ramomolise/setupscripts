# Hardware-neutral default. Add explicit monitor rules above this line if needed.
monitor = , preferred, auto, 1

$mod = SUPER
$terminal = kitty
$menu = wofi --show drun
$fileManager = thunar
$browser = firefox

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = nm-applet --indicator
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = hypridle

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(8455b8ff) rgba(c7c4ceff) 45deg
    col.inactive_border = rgba(3b3944aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.96
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 7
        passes = 2
        vibrancy = 0.15
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = architect, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 5, architect
    animation = windowsOut, 1, 4, default, popin 85%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, architect
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

bind = , Print, exec, sh -c 'grim -g "$(slurp)" "$HOME/Pictures/Screenshots/Screenshot-$(date +%Y%m%d-%H%M%S).png"'
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = opacity 0.94 0.88, class:^(firefox)$
