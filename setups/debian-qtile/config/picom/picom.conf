backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.32;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";

corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 5;

active-opacity = 0.96;
inactive-opacity = 0.88;
frame-opacity = 0.94;
inactive-opacity-override = false;

opacity-rule = [
    "100:window_type = 'dock'",
    "100:window_type = 'desktop'",
    "97:class_g = 'firefox-esr'",
    "97:class_g = 'Firefox'"
];

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
    dropdown_menu = { opacity = 0.96; };
    popup_menu = { opacity = 0.96; };
    utility = { opacity = 0.96; };
};
